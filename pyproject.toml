[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labcem"
version = "0.1.0"
description = "LabCEM scaffold integrating Label9 runtime"
requires-python = ">=3.8"
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "trimesh",
  "pyvista",
  "matplotlib",
]

[project.optional-dependencies]
sdf_optional = [
  "open3d",
  "mesh_to_sdf",
  "pysdf",
]
doc_import = [
  "pypdf",
  "python-docx",
]
llm = [
  "openai",
  "python-dotenv",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
